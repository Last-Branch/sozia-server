[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sozia-server"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=sozia --cov-report=term-missing"

[tool.coverage.run]
source = ["sozia"]
omit = ["sozia/__init__.py"]
